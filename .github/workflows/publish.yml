on:
  workflow_dispatch:
  push:
    branches:
      - main          # run on every push to main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # allow the workflow to push to gh-pages

    steps:
      # 1 ▸ Check out your repository
      - name: Check out repository
        uses: actions/checkout@v3


      # 2 ▸ Install R 4.5.x
      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      # 3 ▸ Install required R packages
      - name: Install R packages with pak
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'pak::pkg_install(c(
            "baseballr",
            "broom",
            "caret",
            "corrplot",
            "cowplot",
            "cluster",
            "ClusterR",
            "condformat",
            "DBI",
            "DescTools",
            "DT",
            "easystats",
            "effectsize",
            "factoextra",
            "flextable",
            "fmsb",
            "foreign",
            "formatR",
            "formattable",
            "ggridges",
            "gt",
            "here",
            "irr",
            "janitor",
            "kableExtra",
            "knitr",
            "lubridate",
            "Lahman",
            "magrittr",
            "mclust",
            "mgcv",
            "NbClust",
            "parameters",
            "plotly",
            "psych",
            "pwr",
            "reshape2",
            "rmarkdown",
            "RSQLite",
            "scales",
            "SimplyAgree",
            "stringr",
            "tidyverse",
            "webexercises",
            
            
            # GitHub Packages
            "haleyjeppson/ggmosaic",
            "kcuilla/reactablefmtr"
            
          ))'
          
      # 4 ▸ Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # with:
        #   version: '1.5.48'   # pin a specific Quarto version if desired

      # 5 ▸ NEW: Build sidebars
      - name: Build sport and sidebar pages
        run: Rscript build_sport_pages.R && Rscript build_sidebar_yaml.R

      # 6 ▸ Render the site and publish to gh-pages
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
